<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>המרכז הרנדומלי - הפתעות בקליק</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rubik', sans-serif;
            background-color: #f8fafc;
        }
        @keyframes popIn {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .card-hover {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.08);
        }
        .dilemma-option {
            transition: all 0.2s ease;
        }
        .dilemma-option:not(:disabled):hover {
            border-color: #f43f5e;
            background-color: #fff1f2;
            transform: translateY(-2px);
        }
        .dilemma-option:not(:disabled):active {
            transform: scale(0.97);
        }
        .dilemma-option.chosen {
            background-color: #f43f5e;
            border-color: #f43f5e;
            color: #ffffff;
            transform: scale(1.03);
            box-shadow: 0 8px 20px -6px rgba(244, 63, 94, 0.5);
        }
        .dilemma-option.faded {
            opacity: 0.35;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- התראה צפה להעתקה -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-xl font-medium text-sm flex items-center gap-2 opacity-0 pointer-events-none transition-all duration-300 translate-y-4">
        <span>📋</span>
        <span id="toast-msg">הטקסט הועתק ללוח!</span>
    </div>

    <!-- כותרת עליונה -->
    <header class="bg-gradient-to-l from-indigo-600 via-purple-600 to-pink-600 text-white py-10 px-4 shadow-lg">
        <div class="max-w-6xl mx-auto text-center">
            <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight mb-3">
                🎲 המרכז הרנדומלי המורחב
            </h1>
            <p class="text-indigo-100 text-base sm:text-lg max-w-2xl mx-auto mb-7">
                עובדות, משימות, דילמות, חידות וציטוטים – לחצו על כל כרטיס או רעננו הכל יחד!
            </p>
            <button onclick="randomizeAll()" class="bg-white text-indigo-700 hover:bg-indigo-50 active:scale-95 transition-all font-bold py-3.5 px-8 rounded-2xl shadow-xl inline-flex items-center gap-2.5 text-base sm:text-lg cursor-pointer">
                <span>⚡</span>
                <span>רענן את כל הכרטיסים יחד!</span>
            </button>
        </div>
    </header>

    <!-- תוכן מרכזי - רשת 6 כרטיסים -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-8 sm:py-12">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-7">

            <!-- 1. הידעת? -->
            <section class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 card-hover flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-2.5">
                            <span class="w-10 h-10 rounded-2xl bg-amber-100 text-amber-600 flex items-center justify-center text-xl">💡</span>
                            <h2 class="text-lg font-bold text-slate-800 leading-tight">הידעת?</h2>
                        </div>
                        <button onclick="copyText('fact-text')" title="העתק עובדה" class="p-2 text-slate-400 hover:text-amber-600 hover:bg-amber-50 rounded-xl transition-colors cursor-pointer">
                            📋
                        </button>
                    </div>
                    <div class="bg-amber-50/70 border border-amber-100 rounded-2xl p-5 min-h-[155px] flex items-center justify-center text-center">
                        <p id="fact-text" class="text-slate-700 font-medium text-base leading-relaxed"></p>
                    </div>
                </div>
                <button onclick="generateFact()" class="mt-5 w-full bg-amber-500 hover:bg-amber-600 active:scale-95 text-white font-semibold py-3 px-4 rounded-xl transition-all shadow-sm cursor-pointer">
                    עובדה מפתיעה אחרת 🔄
                </button>
            </section>

            <!-- 2. מה עושים עכשיו? -->
            <section class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 card-hover flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-2.5">
                            <span class="w-10 h-10 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-xl">🚀</span>
                            <h2 class="text-lg font-bold text-slate-800 leading-tight">מה עושים עכשיו?</h2>
                        </div>
                        <button onclick="copyText('activity-text')" title="העתק משימה" class="p-2 text-slate-400 hover:text-emerald-600 hover:bg-emerald-50 rounded-xl transition-colors cursor-pointer">
                            📋
                        </button>
                    </div>
                    <div class="bg-emerald-50/70 border border-emerald-100 rounded-2xl p-5 min-h-[155px] flex flex-col items-center justify-center text-center gap-2.5">
                        <span id="activity-emoji" class="text-4xl">🎯</span>
                        <p id="activity-text" class="text-slate-700 font-medium text-base leading-relaxed"></p>
                    </div>
                </div>
                <button onclick="generateActivity()" class="mt-5 w-full bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-semibold py-3 px-4 rounded-xl transition-all shadow-sm cursor-pointer">
                    תן לי רעיון חדש ✨
                </button>
            </section>

            <!-- 3. מה עדיף? (אפשרויות לחיצות) -->
            <section class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 card-hover flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-2.5">
                            <span class="w-10 h-10 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center text-xl">⚖️</span>
                            <h2 class="text-lg font-bold text-slate-800 leading-tight">מה עדיף?</h2>
                        </div>
                        <button onclick="copyDilemma()" title="העתק דילמה" class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition-colors cursor-pointer">
                            📋
                        </button>
                    </div>
                    <div class="bg-rose-50/70 border border-rose-100 rounded-2xl p-4 min-h-[155px] flex flex-col justify-center gap-2.5">
                        <button id="dilemma-a" onclick="chooseDilemma('a')" class="dilemma-option bg-white border-2 border-rose-200 rounded-xl p-3 text-center text-sm font-semibold text-slate-700 shadow-sm cursor-pointer"></button>
                        <div class="text-center text-xs font-extrabold text-rose-500">או</div>
                        <button id="dilemma-b" onclick="chooseDilemma('b')" class="dilemma-option bg-white border-2 border-rose-200 rounded-xl p-3 text-center text-sm font-semibold text-slate-700 shadow-sm cursor-pointer"></button>
                    </div>
                </div>
                <button onclick="generateDilemma()" class="mt-5 w-full bg-rose-500 hover:bg-rose-600 active:scale-95 text-white font-semibold py-3 px-4 rounded-xl transition-all shadow-sm cursor-pointer">
                    דילמה אחרת 🤔
                </button>
            </section>

            <!-- 4. משפט השראה -->
            <section class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 card-hover flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-2.5">
                            <span class="w-10 h-10 rounded-2xl bg-indigo-100 text-indigo-600 flex items-center justify-center text-xl">💬</span>
                            <h2 class="text-lg font-bold text-slate-800 leading-tight">משפט השראה</h2>
                        </div>
                        <button onclick="copyQuote()" title="העתק ציטוט" class="p-2 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition-colors cursor-pointer">
                            📋
                        </button>
                    </div>
                    <div class="bg-indigo-50/70 border border-indigo-100 rounded-2xl p-5 min-h-[155px] flex flex-col items-center justify-center text-center gap-2">
                        <p id="quote-text" class="text-slate-700 font-medium text-base leading-relaxed italic"></p>
                        <span id="quote-author" class="text-xs font-bold text-indigo-600 bg-indigo-100/80 px-3 py-1 rounded-full"></span>
                    </div>
                </div>
                <button onclick="generateQuote()" class="mt-5 w-full bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-semibold py-3 px-4 rounded-xl transition-all shadow-sm cursor-pointer">
                    ציטוט מעורר מחשבה ✨
                </button>
            </section>

            <!-- 5. חידה מהירה -->
            <section class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 card-hover flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-2.5">
                            <span class="w-10 h-10 rounded-2xl bg-purple-100 text-purple-600 flex items-center justify-center text-xl">🧩</span>
                            <h2 class="text-lg font-bold text-slate-800 leading-tight">חידה מהירה</h2>
                        </div>
                        <button onclick="toggleRiddleAnswer()" class="text-xs font-bold text-purple-600 bg-purple-50 hover:bg-purple-100 px-3 py-1.5 rounded-xl transition-colors cursor-pointer">
                            גלה תשובה 👁️
                        </button>
                    </div>
                    <div class="bg-purple-50/70 border border-purple-100 rounded-2xl p-5 min-h-[155px] flex flex-col items-center justify-center text-center gap-3">
                        <p id="riddle-question" class="text-slate-700 font-medium text-base leading-relaxed"></p>
                        <div id="riddle-answer-box" class="hidden bg-purple-600 text-white text-sm font-bold px-4 py-2 rounded-xl shadow-sm">
                            <span id="riddle-answer"></span>
                        </div>
                    </div>
                </div>
                <button onclick="generateRiddle()" class="mt-5 w-full bg-purple-600 hover:bg-purple-700 active:scale-95 text-white font-semibold py-3 px-4 rounded-xl transition-all shadow-sm cursor-pointer">
                    חידה חדשה 🧠
                </button>
            </section>

            <!-- 6. שאלה לשיחה -->
            <section class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 card-hover flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-2.5">
                            <span class="w-10 h-10 rounded-2xl bg-cyan-100 text-cyan-600 flex items-center justify-center text-xl">🗣️</span>
                            <h2 class="text-lg font-bold text-slate-800 leading-tight">שאלה לשיחה</h2>
                        </div>
                        <button onclick="copyText('icebreaker-text')" title="העתק שאלה" class="p-2 text-slate-400 hover:text-cyan-600 hover:bg-cyan-50 rounded-xl transition-colors cursor-pointer">
                            📋
                        </button>
                    </div>
                    <div class="bg-cyan-50/70 border border-cyan-100 rounded-2xl p-5 min-h-[155px] flex items-center justify-center text-center">
                        <p id="icebreaker-text" class="text-slate-700 font-medium text-base leading-relaxed"></p>
                    </div>
                </div>
                <button onclick="generateIcebreaker()" class="mt-5 w-full bg-cyan-600 hover:bg-cyan-700 active:scale-95 text-white font-semibold py-3 px-4 rounded-xl transition-all shadow-sm cursor-pointer">
                    שאלה מעניינת אחרת 💬
                </button>
            </section>

        </div>
    </main>

    <!-- כותרת תחתונה -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-slate-500 text-sm">
        <p>המרכז הרנדומלי 🎲</p>
    </footer>

    <!-- לוגיקה ומאגרי נתונים -->
