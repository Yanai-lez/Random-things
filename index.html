        };

        // פונקציית עזר לבחירת אינדקס אקראי שלא זהה לקודם
        function getRandomIndex(length, key) {
            if (length <= 1) return 0;
            let idx;
            do {
                idx = Math.floor(Math.random() * length);
            } while (idx === lastIndex[key]);
            lastIndex[key] = idx;
            return idx;
        }

        // הפעלת אנימציית הופעה מחודשת על אלמנט
        function triggerPop(element) {
            element.classList.remove('animate-pop');
            void element.offsetWidth;
            element.classList.add('animate-pop');
        }

        // 1. מחולל עובדות
        function generateFact() {
            const idx = getRandomIndex(facts.length, 'fact');
            const el = document.getElementById('fact-text');
            el.textContent = facts[idx];
            triggerPop(el);
        }

        // 2. מחולל פעילויות
        function generateActivity() {
            const idx = getRandomIndex(activities.length, 'activity');
            const item = activities[idx];
            const emojiEl = document.getElementById('activity-emoji');
            const textEl = document.getElementById('activity-text');
            emojiEl.textContent = item.emoji;
            textEl.textContent = item.text;
            triggerPop(emojiEl);
            triggerPop(textEl);
        }

        // 3. מחולל דילמות - בחירה בלחיצה ומעבר אוטומטי לדילמה הבאה
        const DILEMMA_DELAY = 1100;
        let dilemmaLocked = false;
        let dilemmaTimer;

        function generateDilemma() {
            clearTimeout(dilemmaTimer);
            dilemmaLocked = false;
            const idx = getRandomIndex(dilemmas.length, 'dilemma');
            const item = dilemmas[idx];
            const elA = document.getElementById('dilemma-a');
            const elB = document.getElementById('dilemma-b');
            [elA, elB].forEach(el => {
                el.classList.remove('chosen', 'faded');
                el.blur();
                el.disabled = false;
            });
            elA.textContent = item.a;
            elB.textContent = item.b;
            triggerPop(elA);
            triggerPop(elB);
        }

        function chooseDilemma(side) {
            if (dilemmaLocked) return;
            dilemmaLocked = true;
            const chosen = document.getElementById('dilemma-' + side);
            chosen.blur();
            const other = document.getElementById('dilemma-' + (side === 'a' ? 'b' : 'a'));
            chosen.classList.add('chosen');
            other.classList.add('faded');
            chosen.disabled = true;
            other.disabled = true;
            dilemmaTimer = setTimeout(generateDilemma, DILEMMA_DELAY);
        }

        // 4. מחולל ציטוטים
        function generateQuote() {
            const idx = getRandomIndex(quotes.length, 'quote');
            const item = quotes[idx];
            const textEl = document.getElementById('quote-text');
            const authorEl = document.getElementById('quote-author');
            textEl.textContent = `"${item.text}"`;
            authorEl.textContent = `— ${item.author}`;
            triggerPop(textEl);
            triggerPop(authorEl);
        }

        // 5. מחולל חידות
        function generateRiddle() {
            const idx = getRandomIndex(riddles.length, 'riddle');
            const item = riddles[idx];
            const qEl = document.getElementById('riddle-question');
            const aEl = document.getElementById('riddle-answer');
            const boxEl = document.getElementById('riddle-answer-box');
            qEl.textContent = item.q;
            aEl.textContent = item.a;
            boxEl.classList.add('hidden');
            triggerPop(qEl);
        }

        function toggleRiddleAnswer() {
            const boxEl = document.getElementById('riddle-answer-box');
            boxEl.classList.toggle('hidden');
            if (!boxEl.classList.contains('hidden')) {
                triggerPop(boxEl);
            }
        }

        // 6. מחולל שאלות לשיחה
        function generateIcebreaker() {
            const idx = getRandomIndex(icebreakers.length, 'icebreaker');
            const el = document.getElementById('icebreaker-text');
            el.textContent = icebreakers[idx];
            triggerPop(el);
        }

        // רענון כל הכרטיסים יחד
        function randomizeAll() {
            generateFact();
            generateActivity();
            generateDilemma();
            generateQuote();
            generateRiddle();
            generateIcebreaker();
        }

        // העתקה ללוח + התראה
        function copyToClipboard(str) {
            const textarea = document.createElement('textarea');
            textarea.value = str;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('הועתק ללוח בהצלחה!');
            } catch (e) {
                showToast('לא ניתן היה להעתיק');
            }
            document.body.removeChild(textarea);
        }

        function copyText(elementId) {
            const text = document.getElementById(elementId).textContent;
            copyToClipboard(text);
        }

        function copyDilemma() {
            const a = document.getElementById('dilemma-a').textContent;
            const b = document.getElementById('dilemma-b').textContent;
            copyToClipboard(`מה עדיף? ${a} או ${b}?`);
        }

        function copyQuote() {
            const q = document.getElementById('quote-text').textContent;
            const a = document.getElementById('quote-author').textContent;
            copyToClipboard(`${q} ${a}`);
        }

        let toastTimer;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            toast.classList.remove('opacity-0', 'translate-y-4');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4');
            }, 2200);
        }

        // רישום Service Worker - מאפשר התקנה ועבודה גם בלי אינטרנט
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }

        // אתחול בטעינת העמוד
        function initApp() {
            randomizeAll();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
</body>
</html>
