<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Things</title>
    <meta name="description" content="Facts, challenges, dilemmas, riddles and quotes - a surprise in every click">
    <meta name="theme-color" content="#6d28d9">

    <!-- אייקונים -->
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

    <!-- התקנה כאפליקציה (PWA) -->
    <link rel="manifest" href="manifest.json?v=2">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Random Things">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- תצוגה בשיתוף (וואטסאפ, פייסבוק, טלגרם, גוגל ועוד) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Random Things">
    <meta property="og:title" content="Random Things">
    <meta property="og:description" content="Facts, challenges, dilemmas, riddles and quotes - a surprise in every click">
    <meta property="og:url" content="https://yanai-lez.github.io/Random-things/">
    <meta property="og:image" content="https://yanai-lez.github.io/Random-things/icons/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="en_US">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Random Things">
    <meta name="twitter:description" content="Facts, challenges, dilemmas, riddles and quotes - a surprise in every click">
    <meta name="twitter:image" content="https://yanai-lez.github.io/Random-things/icons/og-image.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Rubik', sans-serif; background-color: #f8fafc; }

        @keyframes popIn {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes cardIn {
            0% { opacity: 0; transform: translateY(16px); }
            100% { opacity: 1; transform: none; }
        }
        .card-in { animation: cardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) backwards; }

        @keyframes wiggle {
            0%, 100% { transform: rotate(0); }
            20% { transform: rotate(-12deg) scale(1.12); }
            40% { transform: rotate(10deg) scale(1.12); }
            60% { transform: rotate(-6deg); }
            80% { transform: rotate(4deg); }
        }
        .wiggle { animation: wiggle 0.6s ease; }

        .card-hover { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .dilemma-option { transition: all 0.2s ease; }
        .dilemma-option:not(:disabled):active { transform: scale(0.97); }
        .dilemma-option.chosen {
            background-color: #f43f5e; border-color: #f43f5e; color: #ffffff;
            transform: scale(1.03); box-shadow: 0 8px 20px -6px rgba(244, 63, 94, 0.5);
        }
        .dilemma-option.faded { opacity: 0.35; }

        /* אפקטי hover רק במכשירים עם עכבר, כדי שלא יידבקו במגע */
        @media (hover: hover) and (pointer: fine) {
            .card-hover:hover { transform: translateY(-4px); box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.08); }
            .dilemma-option:not(:disabled):hover { border-color: #f43f5e; background-color: #fff1f2; transform: translateY(-2px); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <canvas id="confetti" class="fixed inset-0 pointer-events-none z-[60]"></canvas>

    <!-- התראה צפה -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-xl font-medium text-sm flex items-center gap-2 opacity-0 pointer-events-none transition-all duration-300 translate-y-4">
        <span id="toast-msg"></span>
        <span id="toast-emoji">📋</span>
    </div>

    <!-- חלון סיכום דילמות -->
    <div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-slate-900/60">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl animate-pop text-center" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <p class="text-sm font-semibold text-rose-500 mb-1">סיכום 10 הדילמות שלך</p>
            <h3 id="modal-title" class="text-2xl font-extrabold text-slate-800 mb-3"></h3>
            <p id="modal-desc" class="text-slate-600 leading-relaxed mb-5"></p>
            <div id="modal-bars" class="space-y-2.5 mb-6 text-sm text-start"></div>
            <div class="flex gap-2">
                <button data-act="modal-share" class="flex-1 bg-rose-500 hover:bg-rose-600 active:scale-95 text-white font-semibold py-3 px-2 text-sm rounded-xl transition-all cursor-pointer">שתף את התוצאה 📤</button>
                <button data-act="modal-close" class="flex-1 bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 font-semibold py-3 px-2 text-sm rounded-xl transition-all cursor-pointer">המשך לדילמות ▶️</button>
            </div>
        </div>
    </div>

    <!-- כותרת עליונה -->
    <header class="bg-gradient-to-l from-indigo-600 via-purple-600 to-pink-600 text-white py-10 px-4 shadow-lg">
        <div class="max-w-6xl mx-auto text-center">
            <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight mb-3">המרכז הרנדומלי 🎲</h1>
            <p class="text-indigo-100 text-base sm:text-lg max-w-2xl mx-auto mb-7">
                עובדות, משימות, דילמות, חידות, בדיחות ועוד – לחצו על כל כרטיס או רעננו הכל יחד!
            </p>
            <button data-act="all" class="bg-white text-indigo-700 hover:bg-indigo-50 active:scale-95 transition-all font-bold py-3.5 px-8 rounded-2xl shadow-xl inline-flex items-center gap-2.5 text-base sm:text-lg cursor-pointer">
                <span>רענן את כל הכרטיסים יחד!</span>
                <span>⚡</span>
            </button>
        </div>
    </header>

    <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-8 sm:py-12">
        <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6 gap-6 sm:gap-7"></div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-6 text-center text-slate-500 text-sm space-y-2">
        <p>המרכז הרנדומלי 🎲</p>
        <button data-act="reset" class="text-xs underline text-slate-400 hover:text-slate-600 cursor-pointer">אפס היסטוריה וניקוד</button>
    </footer>

    <script src="data.js"></script>
    <script>
    (function () {
        'use strict';

        const $ = id => document.getElementById(id);
        const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (!window.DATA) {
            $('grid').innerHTML = '<p class="col-span-full text-center text-slate-500">שגיאה בטעינת התוכן. נסו לרענן את הדף.</p>';
            return;
        }
        const DATA = window.DATA;

        // ---------- שמירה מקומית (בטוחה) ----------
        const store = {
            get(k, def) { try { const v = localStorage.getItem('rt_' + k); return v ? JSON.parse(v) : def; } catch (e) { return def; } },
            set(k, v) { try { localStorage.setItem('rt_' + k, JSON.stringify(v)); } catch (e) { /* ignore */ } },
            del(k) { try { localStorage.removeItem('rt_' + k); } catch (e) { /* ignore */ } }
        };

        // ---------- הגרלה בלי חזרות עד שהמאגר נגמר ----------
        let queues = store.get('queues', {});
        function shuffle(a) {
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }
        const lastShown = {};
        function nextIdx(cat, len) {
            let e = queues[cat];
            if (!e || typeof e.n !== 'number' || !Array.isArray(e.q) || e.n > len) {
                e = { n: len, q: [] };
            } else if (e.n < len) {
                for (let i = e.n; i < len; i++) e.q.push(i);
                e.q = shuffle(e.q);
                e.n = len;
            }
            e.q = e.q.filter(i => i < len);
            if (e.q.length === 0) {
                e.q = shuffle(Array.from({ length: len }, (_, i) => i));
                if (len > 1 && e.q[e.q.length - 1] === lastShown[cat]) {
                    [e.q[0], e.q[e.q.length - 1]] = [e.q[e.q.length - 1], e.q[0]];
                }
            }
            const i = e.q.pop();
            queues[cat] = e;
            store.set('queues', queues);
            lastShown[cat] = i;
            return i;
        }
        function pick(cat) { return DATA[cat][nextIdx(cat, DATA[cat].length)]; }

        // ---------- עזרים ----------
        function pop(el) {
            if (!el) return;
            el.classList.remove('animate-pop');
            void el.offsetWidth;
            el.classList.add('animate-pop');
        }
        function wiggle(cat) {
            const t = document.querySelector('[data-card="' + cat + '"] .tile');
            if (!t) return;
            t.classList.remove('wiggle');
            void t.offsetWidth;
            t.classList.add('wiggle');
        }
        function fmtDur(s) {
            if (s < 60) return s + ' שניות';
            const m = Math.floor(s / 60), r = s % 60;
            const mw = m === 1 ? 'דקה' : m + ' דקות';
            if (r === 0) return mw;
            if (r === 30) return m === 1 ? 'דקה וחצי' : m + ' דקות וחצי';
            return mw + ' ו-' + r + ' שניות';
        }
        function fmtClock(sec) {
            const m = Math.floor(sec / 60), s = sec % 60;
            return m + ':' + String(s).padStart(2, '0');
        }

        // ---------- הודעה צפה ----------
        let toastTimer;
        function showToast(msg, emoji) {
            const t = $('toast');
            $('toast-msg').textContent = msg;
            $('toast-emoji').textContent = emoji || '📋';
            t.classList.remove('opacity-0', 'translate-y-4');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.add('opacity-0', 'translate-y-4'), 2200);
        }
        function copyToClipboard(str) {
            const fallback = () => {
                const ta = document.createElement('textarea');
                ta.value = str;
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                let ok = false;
                try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
                document.body.removeChild(ta);
                showToast(ok ? 'הועתק ללוח בהצלחה!' : 'לא ניתן היה להעתיק', ok ? '📋' : '⚠️');
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(str).then(() => showToast('הועתק ללוח בהצלחה!', '📋'), fallback);
            } else {
                fallback();
            }
        }

        // ---------- קונפטי ----------
        const cv = $('confetti');
        const ctx = cv.getContext('2d');
        const CONF_COLORS = ['#f43f5e', '#f59e0b', '#10b981', '#6366f1', '#06b6d4', '#a855f7', '#ec4899'];
        let parts = [], raf = null;
        function sizeCanvas() { cv.width = window.innerWidth; cv.height = window.innerHeight; }
        window.addEventListener('resize', sizeCanvas);
        sizeCanvas();
        function confetti(n, origin) {
            if (reduced) return;
            const ox = origin ? origin.x : window.innerWidth / 2;
            const oy = origin ? origin.y : window.innerHeight * 0.35;
            for (let i = 0; i < (n || 70); i++) {
                parts.push({
                    x: ox, y: oy,
                    vx: (Math.random() - 0.5) * 13, vy: Math.random() * -13 - 3,
                    w: 6 + Math.random() * 6, h: 4 + Math.random() * 6,
                    r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
                    c: CONF_COLORS[Math.floor(Math.random() * CONF_COLORS.length)], life: 0
                });
            }
            if (!raf) raf = requestAnimationFrame(tick);
        }
        function tick() {
            ctx.clearRect(0, 0, cv.width, cv.height);
            parts = parts.filter(p => p.life < 150 && p.y < cv.height + 30);
            for (const p of parts) {
                p.vy += 0.38; p.vx *= 0.99;
                p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.r);
                ctx.fillStyle = p.c;
                ctx.globalAlpha = Math.max(0, 1 - p.life / 150);
                ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                ctx.restore();
            }
            if (parts.length) { raf = requestAnimationFrame(tick); }
            else { raf = null; ctx.clearRect(0, 0, cv.width, cv.height); }
        }
        function originOf(el) {
            const r = el.getBoundingClientRect();
            return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
        }

        // ---------- הגדרת הכרטיסים ----------
        const COLOR = {
            facts: 'amber', activities: 'emerald', dilemmas: 'rose', quotes: 'indigo', riddles: 'purple',
            icebreakers: 'cyan', jokes: 'orange', truthdare: 'pink', whoami: 'teal', challenges: 'sky', blessings: 'fuchsia'
        };
        const shade = c => (c === 'amber' || c === 'orange') ? 500 : 600;
        const copyBtn = (cat) => {
            const c = COLOR[cat];
            return '<button data-act="copy" data-cat="' + cat + '" title="העתק" class="p-2 text-slate-400 hover:text-' + c + '-600 hover:bg-' + c + '-50 rounded-xl transition-colors cursor-pointer">📋</button>';
        };
        const chipBtn = (act, id, label, cat) => {
            const c = COLOR[cat];
            return '<button data-act="' + act + '" id="' + id + '" class="text-xs font-bold text-' + c + '-700 bg-' + c + '-100 hover:bg-' + c + '-200 px-3 py-1.5 rounded-xl transition-colors cursor-pointer whitespace-nowrap">' + label + '</button>';
        };
        const mainBtn = (cat, label, id) => {
            const c = COLOR[cat], s = shade(c);
            return '<button data-act="next" data-cat="' + cat + '"' + (id ? ' id="' + id + '"' : '') + ' class="w-full bg-' + c + '-' + s + ' hover:bg-' + c + '-' + (s + 100) + ' active:scale-95 text-white font-semibold py-3 px-4 rounded-xl transition-all shadow-sm cursor-pointer">' + label + '</button>';
        };
        const bodyText = id => '<p id="' + id + '" class="text-slate-700 font-medium text-base leading-relaxed"></p>';

        const CARDS = [
            { id: 'facts', emoji: '💡', title: 'הידעת?',
              actions: copyBtn('facts'), body: bodyText('b-facts'), footer: mainBtn('facts', 'עובדה מפתיעה אחרת 🔄') },
            { id: 'activities', emoji: '🚀', title: 'מה עושים עכשיו?',
              actions: copyBtn('activities'),
              body: '<span id="b-activities-emoji" class="text-4xl">🎯</span>' + bodyText('b-activities'),
              extra: '<div id="timer-activities" class="mt-3"></div>',
              footer: mainBtn('activities', 'תן לי רעיון חדש ✨') },
            { id: 'dilemmas', emoji: '⚖️', title: 'מה עדיף?',
              actions: copyBtn('dilemmas'),
              body: '<div class="w-full flex flex-col gap-2.5">' +
                    '<button id="dil-a" data-act="dil" data-side="a" class="dilemma-option w-full bg-white border-2 border-rose-200 rounded-xl p-3 text-center text-sm font-semibold text-slate-700 shadow-sm cursor-pointer"></button>' +
                    '<div class="text-center text-xs font-extrabold text-rose-500">או</div>' +
                    '<button id="dil-b" data-act="dil" data-side="b" class="dilemma-option w-full bg-white border-2 border-rose-200 rounded-xl p-3 text-center text-sm font-semibold text-slate-700 shadow-sm cursor-pointer"></button></div>',
              extra: '<p id="dil-progress" class="mt-3 text-center text-xs font-medium text-rose-600"></p>',
              footer: mainBtn('dilemmas', 'דילמה אחרת 🤔') },
            { id: 'quotes', emoji: '💬', title: 'משפט השראה',
              actions: copyBtn('quotes'),
              body: '<p id="b-quotes" class="text-slate-700 font-medium text-base leading-relaxed italic"></p><span id="b-quotes-author" class="text-xs font-bold text-indigo-600 bg-indigo-100/80 px-3 py-1 rounded-full"></span>',
              footer: mainBtn('quotes', 'ציטוט מעורר מחשבה ✨') },
            { id: 'riddles', emoji: '🧩', title: 'חידה מהירה',
              actions: copyBtn('riddles') + chipBtn('riddle-reveal', 'riddle-reveal', 'תשובה 👁️', 'riddles'),
              body: bodyText('riddle-q') +
                    '<div id="riddle-a-box" class="hidden bg-purple-600 text-white text-sm font-bold px-4 py-2 rounded-xl shadow-sm"><span id="riddle-a"></span></div>' +
                    '<div id="riddle-btns" class="hidden w-full grid grid-cols-2 gap-2">' +
                    '<button data-act="riddle-known" class="bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white text-sm font-bold py-2.5 rounded-xl transition-all cursor-pointer">ידעתי ✅</button>' +
                    '<button data-act="riddle-unknown" class="bg-rose-100 hover:bg-rose-200 active:scale-95 text-rose-700 text-sm font-bold py-2.5 rounded-xl transition-all cursor-pointer">לא ידעתי ❌</button></div>',
              extra: '<p id="riddle-score" class="mt-3 text-center text-xs font-medium text-purple-700"></p>',
              footer: mainBtn('riddles', 'חידה חדשה 🧠') },
            { id: 'icebreakers', emoji: '🗣️', title: 'שאלה לשיחה',
              actions: copyBtn('icebreakers'), body: bodyText('b-icebreakers'), footer: mainBtn('icebreakers', 'שאלה מעניינת אחרת 💬') },
            { id: 'jokes', emoji: '😂', title: 'בדיחה',
              actions: copyBtn('jokes') + chipBtn('joke-reveal', 'joke-reveal', 'פואנטה 👁️', 'jokes'),
              body: bodyText('joke-q') +
                    '<div id="joke-a-box" class="hidden bg-orange-500 text-white text-sm font-bold px-4 py-2 rounded-xl shadow-sm"><span id="joke-a"></span></div>',
              footer: mainBtn('jokes', 'בדיחה אחרת 😂') },
            { id: 'truthdare', emoji: '🎭', title: 'אמת או חובה',
              actions: copyBtn('truthdare'),
              body: '<span id="td-label" class="text-xs font-extrabold px-3 py-1 rounded-full"></span>' + bodyText('td-text'),
              footer: '<div class="grid grid-cols-2 gap-2">' +
                      '<button data-act="td" data-mode="truth" class="border-2 border-pink-300 text-pink-700 hover:bg-pink-50 active:scale-95 font-semibold py-2.5 rounded-xl transition-all cursor-pointer">אמת 🤔</button>' +
                      '<button data-act="td" data-mode="dare" class="border-2 border-pink-300 text-pink-700 hover:bg-pink-50 active:scale-95 font-semibold py-2.5 rounded-xl transition-all cursor-pointer">חובה 🔥</button></div>' +
                      mainBtn('truthdare', 'הגרל אמת או חובה 🎲') },
            { id: 'whoami', emoji: '🕵️', title: 'נחש מי אני',
              actions: chipBtn('who-new', 'who-new', 'חדש 🔄', 'whoami'),
              body: '<ol id="who-list" class="w-full space-y-2 text-start"></ol>' +
                    '<div id="who-answer" class="hidden bg-teal-600 text-white text-base font-bold px-5 py-2 rounded-xl shadow-sm"></div>',
              footer: '<button data-act="who-step" id="who-main" class="w-full bg-teal-600 hover:bg-teal-700 active:scale-95 text-white font-semibold py-3 px-4 rounded-xl transition-all shadow-sm cursor-pointer"></button>' },
            { id: 'challenges', emoji: '⏱️', title: 'אתגר בדקה',
              actions: copyBtn('challenges'),
              body: '<span id="b-challenges-emoji" class="text-4xl">🎯</span>' + bodyText('b-challenges') +
                    '<span id="b-challenges-dur" class="text-xs font-bold text-sky-700 bg-sky-100 px-3 py-1 rounded-full"></span>',
              extra: '<div id="timer-challenges" class="mt-3"></div>',
              footer: mainBtn('challenges', 'אתגר אחר 🎯') },
            { id: 'blessings', emoji: '🎁', title: 'ברכה אקראית',
              actions: copyBtn('blessings'), body: bodyText('b-blessings'), footer: mainBtn('blessings', 'ברכה אחרת 🎁') }
        ];

        function cardHTML(c, i) {
            const col = COLOR[c.id];
            const n = CARDS.length;
            const span = i === n - 1 ? 'md:col-span-2 lg:col-span-3' : (i === n - 2 ? 'lg:col-span-3' : 'lg:col-span-2');
            return '<section data-card="' + c.id + '" style="animation-delay:' + (i * 60) + 'ms" class="card-in ' + span + ' bg-white rounded-3xl p-6 shadow-sm border border-slate-100 card-hover flex flex-col justify-between">' +
                '<div>' +
                '<div class="flex items-center justify-between mb-4 gap-2">' +
                '<div class="flex items-center gap-2.5 min-w-0">' +
                '<h2 class="text-lg font-bold text-slate-800 leading-tight">' + c.title + '</h2>' +
                '<span class="tile w-10 h-10 shrink-0 rounded-2xl bg-' + col + '-100 text-' + col + '-600 flex items-center justify-center text-xl">' + c.emoji + '</span>' +
                '</div>' +
                '<div class="flex items-center gap-1 shrink-0">' + c.actions + '</div>' +
                '</div>' +
                '<div class="bg-' + col + '-50/70 border border-' + col + '-100 rounded-2xl p-5 min-h-[155px] flex flex-col items-center justify-center text-center gap-2.5">' + c.body + '</div>' +
                (c.extra || '') +
                '</div>' +
                '<div class="mt-5 space-y-2">' + c.footer + '</div>' +
                '</section>';
        }
        $('grid').innerHTML = CARDS.map(cardHTML).join('');

        // ---------- טיימר (משימות ואתגרים) ----------
        const timers = { activities: { state: 'idle', sec: 0 }, challenges: { state: 'idle', sec: 0 } };
        let tickIv = null;

        function renderTimer(cat) {
            const box = $('timer-' + cat), t = timers[cat], c = COLOR[cat];
            if (!t.sec) { box.innerHTML = ''; return; }
            if (t.state === 'idle') {
                box.innerHTML = '<button data-act="timer-start" data-cat="' + cat + '" class="w-full border-2 border-' + c + '-300 text-' + c + '-700 hover:bg-' + c + '-50 active:scale-95 font-semibold py-2.5 rounded-xl transition-all cursor-pointer">התחל טיימר · ' + fmtDur(t.sec) + ' ⏱️</button>';
            } else if (t.state === 'run') {
                box.innerHTML = '<div class="text-center">' +
                    '<div id="tm-' + cat + '" class="text-4xl font-extrabold tabular-nums text-slate-800">' + fmtClock(t.sec) + '</div>' +
                    '<div class="h-2 rounded-full bg-slate-200 overflow-hidden my-2"><div id="tb-' + cat + '" class="h-full bg-' + c + '-500 rounded-full" style="width:100%"></div></div>' +
                    '<button data-act="timer-stop" data-cat="' + cat + '" class="text-sm font-semibold text-slate-500 underline cursor-pointer">עצור</button></div>';
            } else {
                box.innerHTML = '<div class="text-center font-bold text-slate-700 py-2.5 animate-pop">סיימת! כל הכבוד 🎉</div>';
            }
        }
        function setTimerItem(cat, sec) {
            timers[cat] = { state: 'idle', sec: sec || 0 };
            renderTimer(cat);
        }
        function startTimer(cat) {
            const t = timers[cat];
            if (!t.sec || t.state === 'run') return;
            t.state = 'run';
            t.total = t.sec * 1000;
            t.end = Date.now() + t.total;
            renderTimer(cat);
            if (!tickIv) tickIv = setInterval(timerTick, 200);
        }
        function stopTimer(cat) {
            const t = timers[cat];
            t.state = 'idle';
            renderTimer(cat);
        }
        function timerTick() {
            let anyRunning = false;
            for (const cat of Object.keys(timers)) {
                const t = timers[cat];
                if (t.state !== 'run') continue;
                const left = t.end - Date.now();
                if (left <= 0) {
                    t.state = 'done';
                    renderTimer(cat);
                    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) { /* ignore */ }
                    const card = document.querySelector('[data-card="' + cat + '"]');
                    confetti(80, card ? originOf(card) : null);
                    setTimeout(() => { if (timers[cat].state === 'done') { timers[cat].state = 'idle'; renderTimer(cat); } }, 2800);
                    continue;
                }
                anyRunning = true;
                const tm = $('tm-' + cat), tb = $('tb-' + cat);
                if (tm) tm.textContent = fmtClock(Math.ceil(left / 1000));
                if (tb) tb.style.width = Math.max(0, left / t.total * 100) + '%';
            }
            if (!anyRunning) { clearInterval(tickIv); tickIv = null; }
        }

        // ---------- מחוללים ----------
        function setText(id, text) { const el = $(id); el.textContent = text; pop(el); }

        function genFacts() { setText('b-facts', pick('facts')); wiggle('facts'); }
        function genIcebreakers() { setText('b-icebreakers', pick('icebreakers')); wiggle('icebreakers'); }
        function genBlessings() { setText('b-blessings', pick('blessings')); wiggle('blessings'); }

        function genActivities() {
            const a = pick('activities');
            $('b-activities-emoji').textContent = a.emoji;
            setText('b-activities', a.text);
            pop($('b-activities-emoji'));
            setTimerItem('activities', a.sec);
            wiggle('activities');
        }

        function genQuotes() {
            const q = pick('quotes');
            setText('b-quotes', '"' + q.text + '"');
            setText('b-quotes-author', '— ' + q.author);
            wiggle('quotes');
        }

        function genChallenges() {
            const c = pick('challenges');
            $('b-challenges-emoji').textContent = c.emoji;
            pop($('b-challenges-emoji'));
            setText('b-challenges', c.text);
            setText('b-challenges-dur', fmtDur(c.sec));
            setTimerItem('challenges', c.sec);
            wiggle('challenges');
        }

        // דילמות
        const TYPES = {
            adventurer: { name: 'הרפתקן', emoji: '🚀', color: '#f97316', desc: 'אתה תמיד בוחר בדרך הפחות שגרתית. בשבילך החיים הם טיול אחד גדול, ואם אין קצת סיכון – אין כיף.' },
            calm: { name: 'שקט וקריר', emoji: '😌', color: '#10b981', desc: 'אתה יודע ליהנות מהשקט, מהנוחות ומהדברים הפשוטים. כשכולם בלחץ, אתה היחיד שנשאר רגוע.' },
            brain: { name: 'חכם', emoji: '🧠', color: '#6366f1', desc: 'אתה בוחר בידע, בהיגיון ובשליטה. תמיד חושב שלושה צעדים קדימה, ואפילו בדילמה מצחיקה אתה מנתח.' },
            funny: { name: 'בדחן', emoji: '😂', color: '#eab308', desc: 'בשבילך הכי חשוב שיהיה כיף וצחוק. אם אין בדיחה בדרך – כנראה שפספסנו משהו.' },
            social: { name: 'חברותי', emoji: '🤝', color: '#ec4899', desc: 'הכי טוב לך כשיש אנשים מסביב. חברים, שמחה וחגיגות – שם אתה בבית.' },
            dreamer: { name: 'חולם', emoji: '🌈', color: '#a855f7', desc: 'הראש שלך מלא רעיונות, דמיון ועולמות אחרים. אתה רואה אפשרויות במקום שאחרים רואים רק קירות.' }
        };
        const TYPE_ORDER = ['adventurer', 'calm', 'brain', 'funny', 'social', 'dreamer'];
        const DIL_GOAL = 10;
        let dilState = store.get('dil', { n: 0, tags: {} });
        let curDil = null, dilLocked = false, dilTimer = null, lastShare = '';

        function updateDilProgress() {
            $('dil-progress').textContent = dilState.n > 0
                ? 'בחרת ' + dilState.n + ' מתוך ' + DIL_GOAL + ' – אחרי ' + DIL_GOAL + ' נגלה איזה טיפוס אתה 😉'
                : 'בחר אפשרות – אחרי ' + DIL_GOAL + ' דילמות נגלה איזה טיפוס אתה 😉';
        }
        function genDilemmas() {
            clearTimeout(dilTimer);
            dilLocked = false;
            curDil = pick('dilemmas');
            const a = $('dil-a'), b = $('dil-b');
            [a, b].forEach(el => { el.classList.remove('chosen', 'faded'); el.disabled = false; el.blur(); });
            a.textContent = curDil.a;
            b.textContent = curDil.b;
            pop(a); pop(b);
            updateDilProgress();
            wiggle('dilemmas');
        }
        function chooseDil(side) {
            if (dilLocked || !curDil) return;
            dilLocked = true;
            const chosen = $('dil-' + side), other = $('dil-' + (side === 'a' ? 'b' : 'a'));
            chosen.classList.add('chosen');
            other.classList.add('faded');
            chosen.disabled = true; other.disabled = true;
            chosen.blur();
            const tag = curDil['t' + side];
            dilState.tags[tag] = (dilState.tags[tag] || 0) + 1;
            dilState.n++;
            store.set('dil', dilState);
            updateDilProgress();
            dilTimer = setTimeout(() => {
                genDilemmas();
                if (dilState.n >= DIL_GOAL) showSummary();
            }, 1100);
        }
        function showSummary() {
            const tags = dilState.tags;
            const total = TYPE_ORDER.reduce((s, k) => s + (tags[k] || 0), 0) || 1;
            const max = Math.max.apply(null, TYPE_ORDER.map(k => tags[k] || 0));
            const tops = TYPE_ORDER.filter(k => (tags[k] || 0) === max);
            let title, desc;
            if (tops.length === 1) {
                const t = TYPES[tops[0]];
                title = 'הטיפוס שלך: ' + t.name + ' ' + t.emoji;
                desc = t.desc;
            } else {
                title = 'אתה שילוב: ' + tops.map(k => TYPES[k].name).join(' + ') + ' 🎭';
                desc = 'אי אפשר לשים אותך בקופסה אחת – יצא לך תיקו בין כמה עולמות. זה בדיוק מה שמעניין בך.';
            }
            $('modal-title').textContent = title;
            $('modal-desc').textContent = desc;
            $('modal-bars').innerHTML = TYPE_ORDER
                .filter(k => (tags[k] || 0) > 0)
                .sort((x, y) => (tags[y] || 0) - (tags[x] || 0))
                .map(k => {
                    const pct = Math.round((tags[k] || 0) / total * 100);
                    return '<div><div class="flex justify-between mb-0.5 font-medium text-slate-700"><span>' + TYPES[k].name + ' ' + TYPES[k].emoji + '</span><span>' + pct + '%</span></div>' +
                        '<div class="h-2.5 rounded-full bg-slate-100 overflow-hidden"><div class="h-full rounded-full" style="width:' + pct + '%;background:' + TYPES[k].color + '"></div></div></div>';
                }).join('');
            lastShare = 'ביצעתי 10 דילמות באתר Random Things ויצא לי: ' + title + ' – בוא נראה מה יצא לך!';
            dilState = { n: 0, tags: {} };
            store.set('dil', dilState);
            updateDilProgress();
            const m = $('modal');
            m.classList.remove('hidden');
            m.classList.add('flex');
            confetti(110);
        }
        function closeModal() {
            const m = $('modal');
            m.classList.add('hidden');
            m.classList.remove('flex');
        }
        function shareResult() {
            const url = location.href.split('#')[0];
            if (navigator.share) {
                navigator.share({ text: lastShare, url: url }).catch(err => {
                    if (!err || err.name !== 'AbortError') copyToClipboard(lastShare + ' ' + url);
                });
            } else {
                copyToClipboard(lastShare + ' ' + url);
            }
        }

        // חידות + ניקוד
        let rs = store.get('riddle', { known: 0, total: 0, streak: 0, best: 0 });
        let curRiddle = null, riddleShown = false, riddleLocked = false;
        function updateRiddleScore() {
            $('riddle-score').textContent = rs.total === 0
                ? 'ענה על חידות וצבור רצף 🔥'
                : 'ידעת ' + rs.known + ' מתוך ' + rs.total + ' · רצף: ' + rs.streak + ' · שיא: ' + rs.best + ' 🔥';
        }
        function setRiddleShown(v) {
            riddleShown = v;
            $('riddle-a-box').classList.toggle('hidden', !v);
            $('riddle-btns').classList.toggle('hidden', !v);
            $('riddle-reveal').textContent = v ? 'הסתר 🙈' : 'תשובה 👁️';
            if (v) pop($('riddle-a-box'));
        }
        function genRiddles() {
            curRiddle = pick('riddles');
            riddleLocked = false;
            $('riddle-a').textContent = curRiddle.a;
            setText('riddle-q', curRiddle.q);
            setRiddleShown(false);
            updateRiddleScore();
            wiggle('riddles');
        }
        function scoreRiddle(known, btn) {
            if (riddleLocked || !riddleShown) return;
            riddleLocked = true;
            rs.total++;
            if (known) {
                rs.known++; rs.streak++;
                rs.best = Math.max(rs.best, rs.streak);
                const big = rs.streak > 0 && rs.streak % 5 === 0;
                confetti(big ? 130 : 55, originOf(btn));
                if (big) showToast('רצף של ' + rs.streak + '! אתה על אש', '🔥');
            } else {
                rs.streak = 0;
            }
            store.set('riddle', rs);
            updateRiddleScore();
            setTimeout(genRiddles, 950);
        }

        // בדיחות
        let curJoke = null, jokeShown = false;
        function setJokeShown(v) {
            jokeShown = v;
            $('joke-a-box').classList.toggle('hidden', !v);
            $('joke-reveal').textContent = v ? 'הסתר 🙈' : 'פואנטה 👁️';
            if (v) pop($('joke-a-box'));
        }
        function genJokes() {
            curJoke = pick('jokes');
            $('joke-a').textContent = curJoke.a;
            setText('joke-q', curJoke.q);
            setJokeShown(false);
            wiggle('jokes');
        }

        // אמת או חובה
        let tdMode = 'truth';
        function genTruthDare(mode) {
            tdMode = mode || (Math.random() < 0.5 ? 'truth' : 'dare');
            const lab = $('td-label');
            lab.textContent = tdMode === 'truth' ? 'אמת 🤔' : 'חובה 🔥';
            lab.className = 'text-xs font-extrabold px-3 py-1 rounded-full ' + (tdMode === 'truth' ? 'bg-pink-100 text-pink-700' : 'bg-rose-100 text-rose-700');
            pop(lab);
            setText('td-text', pick(tdMode));
            wiggle('truthdare');
        }

        // נחש מי אני
        let who = null, whoStep = 1;
        function renderWho() {
            const shown = Math.min(whoStep, 3);
            $('who-list').innerHTML = who.clues.slice(0, shown).map((c, i) =>
                '<li class="flex gap-2 items-start' + (i === shown - 1 ? ' animate-pop' : '') + '"><span class="shrink-0 text-xs font-bold bg-teal-100 text-teal-700 rounded-full px-2 py-0.5 mt-0.5">רמז ' + (i + 1) + '</span>' +
                '<span class="text-slate-700 font-medium leading-relaxed"></span></li>').join('');
            const spans = $('who-list').querySelectorAll('li > span:last-child');
            who.clues.slice(0, shown).forEach((c, i) => { spans[i].textContent = c; });
            const ans = $('who-answer');
            ans.classList.toggle('hidden', whoStep < 4);
            if (whoStep >= 4) { ans.textContent = who.a; pop(ans); }
            $('who-main').textContent = whoStep < 3 ? 'רמז נוסף 💡' : (whoStep === 3 ? 'גלה תשובה 👁️' : 'אתגר חדש 🔄');
        }
        function genWhoami() {
            who = pick('whoami');
            whoStep = 1;
            renderWho();
            wiggle('whoami');
        }
        function stepWho() {
            if (whoStep >= 4) { genWhoami(); return; }
            whoStep++;
            renderWho();
        }

        const GEN = {
            facts: genFacts, activities: genActivities, dilemmas: genDilemmas, quotes: genQuotes,
            riddles: genRiddles, icebreakers: genIcebreakers, jokes: genJokes,
            truthdare: () => genTruthDare(), whoami: genWhoami, challenges: genChallenges, blessings: genBlessings
        };

        const COPY = {
            facts: () => $('b-facts').textContent,
            activities: () => $('b-activities').textContent,
            dilemmas: () => 'מה עדיף? ' + $('dil-a').textContent + ' או ' + $('dil-b').textContent + '?',
            quotes: () => $('b-quotes').textContent + ' ' + $('b-quotes-author').textContent,
            riddles: () => $('riddle-q').textContent + (riddleShown ? '\n' + $('riddle-a').textContent : ''),
            icebreakers: () => $('b-icebreakers').textContent,
            jokes: () => $('joke-q').textContent + (jokeShown ? '\n' + $('joke-a').textContent : ''),
            truthdare: () => (tdMode === 'truth' ? 'אמת: ' : 'חובה: ') + $('td-text').textContent,
            challenges: () => $('b-challenges').textContent + ' (' + $('b-challenges-dur').textContent + ')',
            blessings: () => $('b-blessings').textContent
        };

        function resetAll() {
            if (!window.confirm('לאפס את היסטוריית התוכן שכבר ראית, את ניקוד החידות ואת הדילמות?')) return;
            queues = {};
            store.del('queues'); store.del('riddle'); store.del('dil');
            rs = { known: 0, total: 0, streak: 0, best: 0 };
            dilState = { n: 0, tags: {} };
            updateRiddleScore();
            updateDilProgress();
            showToast('ההיסטוריה והניקוד אופסו', '🧹');
        }

        // ---------- טיפול בלחיצות ----------
        const handlers = {
            next: (el, cat) => GEN[cat] && GEN[cat](),
            all: () => Object.keys(GEN).forEach(k => GEN[k]()),
            copy: (el, cat) => COPY[cat] && copyToClipboard(COPY[cat]()),
            dil: (el) => chooseDil(el.dataset.side),
            'riddle-reveal': () => setRiddleShown(!riddleShown),
            'riddle-known': (el) => scoreRiddle(true, el),
            'riddle-unknown': (el) => scoreRiddle(false, el),
            'joke-reveal': () => setJokeShown(!jokeShown),
            td: (el) => genTruthDare(el.dataset.mode),
            'who-step': () => stepWho(),
            'who-new': () => genWhoami(),
            'timer-start': (el, cat) => startTimer(cat),
            'timer-stop': (el, cat) => stopTimer(cat),
            reset: resetAll,
            'modal-close': closeModal,
            'modal-share': shareResult
        };
        document.addEventListener('click', e => {
            const el = e.target.closest('[data-act]');
            if (!el) return;
            const h = handlers[el.dataset.act];
            if (h) h(el, el.dataset.cat);
        });
        $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

        // ---------- התקנה: Service Worker ----------
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }

        // ---------- אתחול ----------
        Object.keys(GEN).forEach(k => GEN[k]());
    })();
    </script>
</body>
</html>
